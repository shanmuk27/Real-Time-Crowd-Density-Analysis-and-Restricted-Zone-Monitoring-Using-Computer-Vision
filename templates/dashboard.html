{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | CloudCount</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=16" />
</head>
<body class="frame-body">
  <main class="dashboard dashboard-frame">
    <div class="dashboard-body">
      <div class="dashboard-welcome">
        <h1 id="welcome-title">Welcome back</h1>
        <p id="welcome-sub"></p>
      </div>

      <div class="stats-grid">
        <div class="stat-card crowd-card">
          <div class="stat-label">Total Crowd</div>
          <div class="stat-value stat-value-bold" id="stat-instances">0</div>
          <div class="stat-delta">▲ Updated live</div>
        </div>
        <div class="stat-card graph-card" id="monthly-crowd-card" onclick="openCrowdGraph()">
          <div class="stat-label">Monthly Crowd Analysis</div>
          <div class="mini-chart" id="mini-chart"></div>
          <div class="stat-delta">Click to expand ▲</div>
        </div>
        <div class="stat-card identified-card">
          <div class="stat-label">Identified Area</div>
          <div class="identified-list" id="identified-list"></div>
          <div class="stat-delta" id="identified-count"></div>
        </div>
      </div>

      <div class="total-crowd-card">
        <div class="total-crowd-header">
          <div>
            <div class="stat-label">Total Crowd Live</div>
            <div class="total-crowd-value" id="live-total-value">0</div>
          </div>
          <div class="total-crowd-stats">
            <div class="tc-stat"><span class="tc-stat-label">Peak</span><span class="tc-stat-val" id="live-peak">0</span></div>
            <div class="tc-stat"><span class="tc-stat-label">Avg</span><span class="tc-stat-val" id="live-avg">0</span></div>
            <div class="tc-stat"><span class="tc-stat-label">Cameras</span><span class="tc-stat-val" id="live-cameras">0</span></div>
          </div>
        </div>
        <div class="live-chart" id="live-chart"></div>
      </div>

      <section class="camera-cards-section">
        <div class="section-heading">Live Cameras</div>
        <div class="camera-cards-grid" id="camera-cards-grid"></div>
      </section>

      <section class="team-access-card">
        <div class="team-access-head">
          <div>
            <div class="section-heading">Team Access</div>
            <p class="team-access-sub">Team members assigned by the admin</p>
          </div>
          <div class="team-access-count" id="team-active-count"></div>
        </div>
        <div class="team-access-list" id="team-access-list"></div>
      </section>

      <div class="graph-modal" id="graph-modal" onclick="if(event.target===this)closeCrowdGraph()">
        <div class="graph-modal-box">
          <div class="graph-modal-header">
            <h3>Monthly Crowd Analysis</h3>
            <button class="graph-close" onclick="closeCrowdGraph()">✕</button>
          </div>
          <div class="large-chart" id="large-chart"></div>
        </div>
      </div>

      <div class="graph-modal" id="camera-modal" onclick="if(event.target===this)closeCameraView()">
        <div class="graph-modal-box">
          <div class="graph-modal-header">
            <h3 id="camera-modal-title">Camera View</h3>
            <button class="graph-close" onclick="closeCameraView()">✕</button>
          </div>
          <div class="camera-view-body">
            <div class="camera-feed" id="camera-feed">
              <div class="camera-live" id="camera-live"></div>
              <div class="camera-feed-footer" id="camera-feed-caption"></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="{% static 'js/demo_data.js' %}?v=6"></script>
  <script src="{% static 'js/auth.js' %}"></script>
  <script>
    function renderBars(count, data, showLabels) {
      if (!data || !data.length) return;
      var max = 0;
      data.forEach(function (d) {
        if (d.count > max) max = d.count;
      });
      count.innerHTML = "";
      data.forEach(function (d) {
        var col = document.createElement("div");
        col.className = "bar-col";
        var bar = document.createElement("div");
        bar.className = "bar";
        bar.style.height = (d.count / max) * 100 + "%";
        bar.title = "Day " + d.day + ": " + d.count;
        if (showLabels) {
          var value = document.createElement("span");
          value.className = "bar-value";
          value.textContent = d.count;
          bar.appendChild(value);
        }
        col.appendChild(bar);
        var label = document.createElement("span");
        label.className = "bar-label";
        label.textContent = d.day;
        col.appendChild(label);
        count.appendChild(col);
      });
    }

    function buildMiniChart() {
      var mini = document.getElementById("mini-chart");
      var data = (typeof DEMO_MONTHLY_CROWD !== "undefined") ? DEMO_MONTHLY_CROWD : [];
      renderBars(mini, data.slice(0, 14), false);
    }

    function buildLargeChart() {
      var large = document.getElementById("large-chart");
      var data = (typeof DEMO_MONTHLY_CROWD !== "undefined") ? DEMO_MONTHLY_CROWD : [];
      renderBars(large, data, true);
    }

    function openCrowdGraph() {
      buildLargeChart();
      document.getElementById("graph-modal").classList.add("show");
    }

    function closeCrowdGraph() {
      document.getElementById("graph-modal").classList.remove("show");
    }

    function getPersons() {
      return (typeof DEMO_CAMERA_PERSONS !== "undefined") ? DEMO_CAMERA_PERSONS : [];
    }

    function renderIdentified() {
      var list = document.getElementById("identified-list");
      var persons = getPersons().slice().sort(function (a, b) {
        return (a.verified ? 1 : 0) - (b.verified ? 1 : 0);
      });
      list.innerHTML = "";
      var verified = 0;
      persons.forEach(function (p) {
        if (p.verified) verified++;
        var row = document.createElement("div");
        row.className = "identified-row" + (p.verified ? " verified" : " unverified");
        row.onclick = function () {
          if (!p.verified) openCameraView(p);
        };
        var avatar = document.createElement("span");
        avatar.className = "identified-avatar";
        avatar.textContent = p.name.trim().charAt(0).toUpperCase();
        var info = document.createElement("div");
        info.className = "identified-info";
        var name = document.createElement("span");
        name.className = "identified-name";
        name.textContent = p.name;
        var badge = document.createElement("span");
        badge.className = "identified-badge " + (p.verified ? "badge-verified" : "badge-unverified");
        badge.textContent = p.verified ? "● Verified" : "● Unverified";
        info.appendChild(name);
        info.appendChild(badge);
        if (!p.verified) {
          var cam = document.createElement("button");
          cam.className = "view-cam-btn";
          cam.textContent = "View camera";
          info.appendChild(cam);
        }
        row.appendChild(avatar);
        row.appendChild(info);
        list.appendChild(row);
      });
      getField("identified-count").textContent =
        persons.length + " present • " + verified + " verified • " + (persons.length - verified) + " unverified";
    }

    function openCameraView(person) {
      document.getElementById("camera-modal-title").textContent = "Camera View — " + person.name;
      document.getElementById("camera-live").innerHTML =
        '<div class="cam-alert">⚠️ Unknown / Unverified person</div>' +
        '<div class="cam-person">' + person.name.trim().charAt(0).toUpperCase() + "</div>";
      var zone = person.zone || "Camera Area";
      document.getElementById("camera-feed-caption").textContent =
        "Detected: " + person.name + " • Location: " + zone + " • Status: Unverified";
      document.getElementById("camera-modal").classList.add("show");
    }

    function closeCameraView() {
      document.getElementById("camera-modal").classList.remove("show");
    }

    function getLiveCrowd() {
      return (typeof DEMO_LIVE_CROWD !== "undefined") ? DEMO_LIVE_CROWD : [];
    }

    function getCameras() {
      return (typeof DEMO_CAMERAS !== "undefined") ? DEMO_CAMERAS : [];
    }

    function randomCrowd(threshold) {
      var current = Math.floor(Math.random() * (threshold * 1.6));
      return Math.min(current + 10, threshold + 30);
    }

    function buildSparkline(points, danger) {
      var W = 120;
      var H = 40;
      var max = 1;
      points.forEach(function (p) {
        if (p > max) max = p;
      });
      var step = W / (points.length - 1);
      var coords = points.map(function (p, i) {
        return (i * step).toFixed(1) + "," + (H - (p / max) * (H - 4)).toFixed(1);
      });
      var path = "M" + coords.join(" L");
      var svgNS = "http://www.w3.org/2000/svg";
      var svg = document.createElementNS(svgNS, "svg");
      svg.setAttribute("viewBox", "0 0 " + W + " " + H);
      svg.setAttribute("preserveAspectRatio", "none");
      svg.setAttribute("class", "cam-spark");
      var line = document.createElementNS(svgNS, "path");
      line.setAttribute("d", path);
      line.setAttribute("fill", "none");
      line.setAttribute("stroke", danger ? "#dc2626" : "#2563eb");
      line.setAttribute("stroke-width", "2");
      line.setAttribute("stroke-linecap", "round");
      line.setAttribute("stroke-linejoin", "round");
      line.setAttribute("vector-effect", "non-scaling-stroke");
      svg.appendChild(line);
      return svg;
    }

    function buildLiveChart() {
      var chart = document.getElementById("live-chart");
      var data = getLiveCrowd();
      chart.innerHTML = "";
      if (!data || !data.length) return;

      var max = 0;
      data.forEach(function (d) {
        if (d.count > max) max = d.count;
      });
      if (max === 0) max = 1;

      var W = 900;
      var H = 220;
      var padX = 40;
      var padTop = 20;
      var padBottom = 34;
      var n = data.length;
      var step = (W - padX * 2) / (n - 1);

      function x(i) {
        return padX + i * step;
      }
      function y(v) {
        return H - padBottom - ((v / max) * (H - padTop - padBottom));
      }

      var points = data.map(function (d, i) {
        return x(i) + "," + y(d.count);
      });
      var linePath = "M" + points.join(" L");
      var areaPath = linePath +
        " L" + (W - padX) + "," + (H - padBottom) +
        " L" + padX + "," + (H - padBottom) + " Z";

      var svgNS = "http://www.w3.org/2000/svg";
      var svg = document.createElementNS(svgNS, "svg");
      svg.setAttribute("viewBox", "0 0 " + W + " " + H);
      svg.setAttribute("preserveAspectRatio", "none");
      svg.setAttribute("class", "line-chart-svg");

      var area = document.createElementNS(svgNS, "path");
      area.setAttribute("d", areaPath);
      area.setAttribute("fill", "url(#liveGrad)");
      area.setAttribute("class", "line-chart-area");

      var line = document.createElementNS(svgNS, "path");
      line.setAttribute("d", linePath);
      line.setAttribute("fill", "none");
      line.setAttribute("class", "line-chart-line");

      var defs = document.createElementNS(svgNS, "defs");
      var grad = document.createElementNS(svgNS, "linearGradient");
      grad.setAttribute("id", "liveGrad");
      grad.setAttribute("x1", "0");
      grad.setAttribute("y1", "0");
      grad.setAttribute("x2", "0");
      grad.setAttribute("y2", "1");
      var stop1 = document.createElementNS(svgNS, "stop");
      stop1.setAttribute("offset", "0%");
      stop1.setAttribute("stop-color", "#2563eb");
      stop1.setAttribute("stop-opacity", "0.4");
      var stop2 = document.createElementNS(svgNS, "stop");
      stop2.setAttribute("offset", "100%");
      stop2.setAttribute("stop-color", "#2563eb");
      stop2.setAttribute("stop-opacity", "0");
      grad.appendChild(stop1);
      grad.appendChild(stop2);
      defs.appendChild(grad);
      svg.appendChild(defs);
      svg.appendChild(area);
      svg.appendChild(line);

      data.forEach(function (d, i) {
        var g = document.createElementNS(svgNS, "g");

        var dot = document.createElementNS(svgNS, "circle");
        dot.setAttribute("cx", x(i));
        dot.setAttribute("cy", y(d.count));
        dot.setAttribute("r", "4");
        dot.setAttribute("class", "line-chart-dot");

        var tLabel = document.createElementNS(svgNS, "text");
        tLabel.setAttribute("x", x(i));
        tLabel.setAttribute("y", H - 12);
        tLabel.setAttribute("text-anchor", "middle");
        tLabel.setAttribute("class", "line-chart-tick");
        tLabel.textContent = d.time;

        var vLabel = document.createElementNS(svgNS, "text");
        vLabel.setAttribute("x", x(i));
        vLabel.setAttribute("y", y(d.count) - 10);
        vLabel.setAttribute("text-anchor", "middle");
        vLabel.setAttribute("class", "line-chart-val");
        vLabel.textContent = d.count;

        g.appendChild(tLabel);
        g.appendChild(vLabel);
        g.appendChild(dot);
        svg.appendChild(g);
      });

      chart.appendChild(svg);
    }

    function refreshLiveTotals(counts) {
      var sum = 0;
      var peak = 0;
      counts.forEach(function (c) {
        sum += c.count;
        if (c.count > peak) peak = c.count;
      });
      var avg = counts.length ? Math.round(sum / counts.length) : 0;
      getField("live-total-value").textContent = sum;
      getField("stat-instances").textContent = sum;
      getField("live-peak").textContent = peak;
      getField("live-avg").textContent = avg;
      getField("live-cameras").textContent = counts.length;
    }

    function renderCameras() {
      var grid = document.getElementById("camera-cards-grid");
      var cameras = getCameras();
      if (!cameras.length) { grid.innerHTML = ""; return; }

      var counts = [];
      cameras.forEach(function (cam) {
        var count = randomCrowd(cam.threshold);
        counts.push({ cam: cam, count: count });
      });

      grid.innerHTML = "";
      counts.forEach(function (item) {
        var cam = item.cam;
        var count = item.count;
        var danger = count >= cam.threshold;

        var card = document.createElement("div");
        card.className = "cam-card" + (danger ? " danger" : "");

        var head = document.createElement("div");
        head.className = "cam-card-head";
        var name = document.createElement("span");
        name.className = "cam-card-name";
        name.textContent = cam.name;
        var id = document.createElement("span");
        id.className = "cam-card-id";
        id.textContent = cam.id;
        var status = document.createElement("span");
        status.className = "cam-card-status " + (danger ? "status-danger" : "status-ok");
        status.textContent = danger ? "● Danger" : "● Active";

        head.appendChild(name);
        head.appendChild(id);
        head.appendChild(status);

        var body = document.createElement("div");
        body.className = "cam-card-body";

        var left = document.createElement("div");
        left.className = "cam-card-left";
        var num = document.createElement("div");
        num.className = "cam-card-count";
        num.textContent = count;
        var numLabel = document.createElement("div");
        numLabel.className = "cam-card-count-label";
        numLabel.textContent = "people";
        var thresh = document.createElement("div");
        thresh.className = "cam-card-threshold";
        thresh.textContent = "Threshold " + cam.threshold;
        left.appendChild(num);
        left.appendChild(numLabel);
        left.appendChild(thresh);

        var right = document.createElement("div");
        right.className = "cam-card-chart";
        right.appendChild(buildSparkline([count * 0.4, count * 0.8, count * 0.6, count], danger));

        body.appendChild(left);
        body.appendChild(right);

        card.appendChild(head);
        card.appendChild(body);
        grid.appendChild(card);
      });

      refreshLiveTotals(counts);
    }

    function getTeamMembers() {
      return (typeof DEMO_TEAM_MEMBERS !== "undefined") ? DEMO_TEAM_MEMBERS : [];
    }

    function renderTeam() {
      var list = document.getElementById("team-access-list");
      var members = getTeamMembers();
      list.innerHTML = "";
      var active = 0;

      members.forEach(function (m) {
        if (m.active) active++;
        var row = document.createElement("div");
        row.className = "team-row";

        var avatar = document.createElement("span");
        avatar.className = "team-avatar";
        avatar.textContent = m.name.trim().charAt(0).toUpperCase();

        var info = document.createElement("div");
        info.className = "team-info";
        var name = document.createElement("div");
        name.className = "team-name";
        name.textContent = m.name;
        var meta = document.createElement("div");
        meta.className = "team-meta";
        meta.textContent = m.role + " • " + m.email;
        info.appendChild(name);
        info.appendChild(meta);

        var state = document.createElement("span");
        state.className = "team-state " + (m.active ? "state-active" : "state-deactivated");
        state.textContent = m.active ? "● Active" : "● Deactivated";

        var btn = document.createElement("button");
        btn.className = "team-toggle " + (m.active ? "btn-deactivate" : "btn-activate");
        btn.textContent = m.active ? "Deactivate" : "Activate";
        btn.onclick = (function (member, stateEl, btnEl) {
          return function () {
            member.active = !member.active;
            stateEl.className = "team-state " + (member.active ? "state-active" : "state-deactivated");
            stateEl.textContent = member.active ? "● Active" : "● Deactivated";
            btnEl.className = "team-toggle " + (member.active ? "btn-deactivate" : "btn-activate");
            btnEl.textContent = member.active ? "Deactivate" : "Activate";
            updateTeamActiveCount();
          };
        })(m, state, btn);

        row.appendChild(avatar);
        row.appendChild(info);
        row.appendChild(state);
        row.appendChild(btn);
        list.appendChild(row);
      });

      getField("team-active-count").textContent = active + " of " + members.length + " active";
    }

    function updateTeamActiveCount() {
      var members = getTeamMembers();
      var active = 0;
      members.forEach(function (m) {
        if (m.active) active++;
      });
      getField("team-active-count").textContent = active + " of " + members.length + " active";
    }

    (async () => {
      const user = await Auth.currentUser();

      if (!user) return;

      getField("welcome-title").textContent = "Welcome back, " + user.name.split(" ")[0] + "!";
      getField("welcome-sub").textContent =
        "Here's a summary of your cloud environment as of " +
        new Date().toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" }) +
        ".";

      buildMiniChart();

      renderIdentified();

      buildLiveChart();

      renderCameras();

      renderTeam();

      setInterval(function () {
        renderCameras();
      }, 2500);
    })();
  </script>
</body>
</html>
