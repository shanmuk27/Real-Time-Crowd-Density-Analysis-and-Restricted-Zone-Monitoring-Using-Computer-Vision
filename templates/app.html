{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CrowdCount</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{% static 'css/style.css' %}?v=30" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
</head>
<body class="app-body">
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <span class="logo-mark">☁️</span>
        <span class="brand-text">CrowdCount</span>
      </div>

      <nav class="sidebar-nav">
        <a class="nav-item active" data-page="dashboard" onclick="navigateTo(this, '{% url 'DatabaseConectivity:dashboard' %}')">
          <span class="nav-icon">📊</span>
          <span class="nav-label">Dashboard</span>
        </a>
        <a class="nav-item" data-page="live-cameras" onclick="navigateTo(this, '{% url 'DatabaseConectivity:live-cameras' %}')">
          <span class="nav-icon">📡</span>
          <span class="nav-label">Live Cameras</span>
        </a>
        <a class="nav-item" data-page="camera" onclick="navigateTo(this, '{% url 'DatabaseConectivity:camera-management' %}')">
          <span class="nav-icon">📷</span>
          <span class="nav-label">Camera Management</span>
        </a>
        <a class="nav-item" data-page="profile" onclick="navigateTo(this, '{% url 'DatabaseConectivity:profile' %}')">
          <span class="nav-icon">👤</span>
          <span class="nav-label">Profile</span>
        </a>
      </nav>

      <div class="sidebar-bottom">
        <a class="nav-item" id="sidebar-logout" onclick="handleLogout()">
          <span class="nav-icon">🚪</span>
          <span class="nav-label">Sign out</span>
        </a>
      </div>
    </aside>

    <div class="main-area">
      <header class="dashboard-topbar topbar-nav">
        <div class="user-chip">
          <div class="avatar" id="avatar"></div>
          <div class="user-meta">
            <strong id="user-name"></strong>
            <span class="user-id-text" id="user-id"></span>
            <span class="role-badge" id="user-role"></span>
          </div>
        </div>
        <div class="topbar-right">
          <div class="notif-wrap">
            <button class="notif-btn" id="notif-btn" onclick="toggleNotifications()" aria-label="Notifications">
              <span class="notif-icon">🔔</span>
              <span class="notif-badge" id="notif-badge">3</span>
            </button>
            <div class="notif-dropdown" id="notif-dropdown">
              <div class="notif-header">Notifications</div>
              <div class="notif-list" id="notif-list"></div>
            </div>
          </div>
        </div>
      </header>

      <iframe id="content-frame" class="content-frame" allow="camera" src="{% url 'DatabaseConectivity:dashboard' %}"></iframe>
    </div>
  </div>

<script src="{% static 'js/capture.js' %}?v=5"></script>
<script src="{% static 'js/api.js' %}?v=3"></script>
  <script src="{% static 'js/auth.js' %}"></script>
  <script>
    function navigateTo(el, url) {
      document.querySelectorAll(".nav-item[data-page]").forEach(function (item) {
        item.classList.remove("active");
      });
      el.classList.add("active");
      // Forget a pending camera hand-off when leaving Live Cameras, so a
      // stale id cannot pop a modal open on some later visit.
      if (el.getAttribute("data-page") !== "live-cameras") window.__pendingCameraId = null;
      // Bust the frame's HTML cache so a page always runs its current script.
      // Without this a reload can leave the iframe executing an older build.
      var frame = document.getElementById("content-frame");
      frame.src = url + (url.indexOf("?") >= 0 ? "&" : "?") + "_=" + Date.now();
    }

    // Child pages can ask the shell to switch sections, e.g. a dashboard
    // camera card clicking through to the same feed on Live Cameras.
    window.addEventListener("message", function (msg) {
      if (msg.origin !== window.location.origin) return;
      var d = msg.data;
      if (!d || d.type !== "nav:navigate" || !d.page) return;
      var item = document.querySelector('.nav-item[data-page="' + d.page + '"]');
      if (!item) return;
      window.__pendingCameraId = d.cameraId || null;
      item.click();
    });

    async function handleLogout() {
      await Auth.logout();
      window.location.href = "{% url 'DatabaseConectivity:login' %}";
    }

    function toggleNotifications() {
      document.getElementById("notif-dropdown").classList.toggle("show");
    }

    document.addEventListener("click", function (e) {
      const wrap = document.querySelector(".notif-wrap");
      if (wrap && !wrap.contains(e.target)) {
        document.getElementById("notif-dropdown").classList.remove("show");
      }
    });

    async function renderNotifications() {
      var list = document.getElementById("notif-list");
      list.innerHTML = "";
      var notifications = await API.getNotifications();
      var unread = notifications.filter(function (n) { return n.unread; }).length;
      document.getElementById("notif-badge").textContent = unread;
      document.getElementById("notif-badge").style.display = unread ? "" : "none";
      if (!notifications.length) {
        list.innerHTML = '<div class="notif-item"><span class="notif-item-text">No notifications</span></div>';
        return;
      }
      notifications.forEach(function (n) {
        var item = document.createElement("div");
        item.className = "notif-item" + (n.unread ? " unread" : "");
        item.innerHTML =
          '<span class="notif-item-icon">' + n.icon + "</span>" +
          '<div class="notif-item-body">' +
          '<span class="notif-item-text">' + n.message + "</span>" +
          '<span class="notif-item-time">' + n.time + "</span>" +
          "</div>";
        list.appendChild(item);
      });
    }

    renderNotifications();
    setInterval(renderNotifications, 15000);

    (async () => {
      const user = await Auth.currentUser();

      if (!user) {
        window.location.href = "{% url 'DatabaseConectivity:login' %}";
        return;
      }

      document.getElementById("user-name").textContent = user.name;
      document.getElementById("avatar").textContent = user.name.trim().charAt(0).toUpperCase();
      document.getElementById("user-id").textContent = user.name;
      document.getElementById("user-role").textContent = user.role;
      document.getElementById("user-role").classList.add(user.role);
    })();

    window.Capture.registerHost();
  </script>
</body>
</html>
